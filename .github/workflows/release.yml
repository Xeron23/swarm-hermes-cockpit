name: Build and release Windows & Android

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

env:
  CARGO_BUILD_JOBS: 2
  CARGO_TERM_COLOR: always

jobs:
  validate:
    name: Validate client and release metadata
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      updater_signing: ${{ steps.signing.outputs.enabled }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Plan optional updater signing
        id: signing
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
          SOURCE_PRIVATE: ${{ github.event.repository.private }}
        run: |
          node --input-type=module <<'JS'
          import { appendFileSync } from 'node:fs';
          const enabled = Boolean(process.env.TAURI_SIGNING_PRIVATE_KEY);
          if (enabled && process.env.SOURCE_PRIVATE === 'false' && !process.env.ANDROID_DEBUG_KEYSTORE_BASE64) {
            throw new Error('Signed updates from a public source require the existing Android keystore in ANDROID_DEBUG_KEYSTORE_BASE64.');
          }
          appendFileSync(process.env.GITHUB_OUTPUT, `enabled=${enabled}\n`);
          console.log(enabled ? 'Release mode: signed updater' : 'Release mode: bootstrap installers (updater signing not configured)');
          JS
      - run: npm ci
      - run: npm run check && npm test && npm run web:build
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify updater signature validation
        run: cargo test --locked --manifest-path scripts/updater-verifier/Cargo.toml
      - name: Verify frontend source identity
        run: node scripts/check-build-info.mjs
      - name: Plan release
        id: release
        run: node scripts/release.mjs metadata

  build-windows:
    name: Windows x86_64 installers
    needs: validate
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: windows-x86_64
      - run: npm ci
      - name: Remove cached installer outputs
        shell: pwsh
        run: |
          if (Test-Path src-tauri/target/release/bundle) {
            Remove-Item src-tauri/target/release/bundle -Recurse -Force
          }
      - name: Build NSIS and MSI
        run: npx tauri build --ci --bundles msi,nsis -- --locked
      - name: Verify frontend source identity after native build
        run: node scripts/check-build-info.mjs
      - name: Verify native HTTP and command permissions on Windows
        run: node scripts/test-windows-native.mjs
        env:
          HTTP_PROXY: http://127.0.0.1:9
          HTTPS_PROXY: http://127.0.0.1:9
          ALL_PROXY: http://127.0.0.1:9
          NO_PROXY: ''
      - name: Collect Windows installers
        shell: pwsh
        run: |
          $files = @(Get-ChildItem src-tauri/target/release/bundle -Recurse -File | Where-Object { $_.Extension -in '.exe', '.msi' })
          foreach ($extension in '.exe', '.msi') {
            if (-not ($files | Where-Object { $_.Extension -eq $extension })) {
              throw "Missing Windows installer: $extension"
            }
          }
          New-Item -ItemType Directory -Path release-assets -Force | Out-Null
          Copy-Item -LiteralPath $files.FullName -Destination release-assets
      - name: Sign and verify Windows updater packages
        run: node scripts/sign-updates.mjs release-assets
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          HERMES_UPDATER_SIGNING_REQUIRED: ${{ needs.validate.outputs.updater_signing }}
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: release-assets/*
          if-no-files-found: error
          retention-days: 14

  build-android:
    name: Android ARM64 debug APK
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    concurrency:
      group: hermes-android-signing-identity
      cancel-in-progress: false
    env:
      ANDROID_NDK_VERSION: 26.1.10909125
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
        with:
          # Official repository: commandlinetools-linux-16111833_latest.zip.
          cmdline-tools-version: '16111833'
          log-accepted-android-sdk-licenses: false
          packages: platform-tools
      - name: Install SDK matching the pinned Tauri CLI template
        run: |
          sdkmanager --install "platforms;android-36" "platforms;android-37.0" "build-tools;37.0.0" "ndk;$ANDROID_NDK_VERSION"
          echo "NDK_HOME=$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: android-aarch64
      - name: Reuse debug signing identity when cached
        if: ${{ needs.validate.outputs.updater_signing != 'true' || github.event.repository.private }}
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: hermes-android-debug-keystore-v1
      - run: npm ci
      - name: Generate Android project
        run: npx tauri android init --ci --skip-targets-install
      - name: Restore Android signing identity for public signed releases
        if: ${{ needs.validate.outputs.updater_signing == 'true' && github.event.repository.private == false }}
        env:
          ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          data = base64.b64decode(os.environ['ANDROID_DEBUG_KEYSTORE_BASE64'], validate=True)
          if not data:
              raise SystemExit('Android signing identity is empty.')
          destination = Path.home() / '.android' / 'debug.keystore'
          destination.parent.mkdir(parents=True, exist_ok=True)
          destination.write_bytes(data)
          destination.chmod(0o600)
          PY
          keytool -list -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey > /dev/null
      - name: Restore durable Android signing identity
        if: ${{ needs.validate.outputs.updater_signing == 'true' && github.event.repository.private }}
        run: node scripts/android-signing.mjs restore
        env:
          GH_TOKEN: ${{ github.token }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      - name: Build Android APK
        run: npx tauri android build --apk --debug --target aarch64 --ci -- --locked
      - name: Verify frontend source identity after native build
        run: node scripts/check-build-info.mjs
      - name: Collect and verify ARM64 APKs
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import shutil
          import zipfile
          files = sorted(Path('src-tauri/gen/android/app/build/outputs/apk').rglob('*.apk'))
          if not files:
              raise SystemExit('No Android APK was built')
          output = Path('release-assets')
          output.mkdir()
          for source in files:
              with zipfile.ZipFile(source) as apk:
                  names = apk.namelist()
                  if 'AndroidManifest.xml' not in names or not any(name.startswith('lib/arm64-v8a/') and 'hermes' in name and name.endswith('.so') for name in names):
                      raise SystemExit(f'Missing Android manifest or ARM64 app library: {source}')
                  if apk.testzip() is not None:
                      raise SystemExit(f'Corrupt APK: {source}')
              shutil.copy2(source, output / f'hermes-cockpit-android-arm64-{source.name}')
          PY
          for apk in release-assets/*.apk; do
            "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --verbose "$apk"
          done
      - name: Preserve Android signing identity privately
        if: ${{ needs.validate.outputs.updater_signing == 'true' && github.event.repository.private }}
        run: node scripts/android-signing.mjs save
        env:
          GH_TOKEN: ${{ github.token }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      - name: Sign and verify Android updater package
        run: node scripts/sign-updates.mjs release-assets
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          HERMES_UPDATER_SIGNING_REQUIRED: ${{ needs.validate.outputs.updater_signing }}
      - uses: actions/upload-artifact@v4
        with:
          name: release-android
          path: release-assets/*
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish ${{ needs.validate.outputs.tag }}
    needs: [validate, build-windows, build-android]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: hermes-public-release-promotion
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - run: npm ci
      - name: Prepare optional signed feed before publishing the version release
        id: feed
        run: node scripts/publish-public.mjs prepare release-assets
        env:
          HERMES_UPDATER_SIGNING_REQUIRED: ${{ needs.validate.outputs.updater_signing }}
      - name: Publish only after all platform assets are ready
        run: node scripts/release.mjs publish release-assets
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Promote the same-repository update channel
        if: ${{ steps.feed.outputs.signed == 'true' }}
        run: node scripts/publish-public.mjs release-assets
        env:
          GH_TOKEN: ${{ github.token }}
          HERMES_UPDATER_SIGNING_REQUIRED: ${{ needs.validate.outputs.updater_signing }}
      - name: Verify anonymous public update feed
        if: ${{ steps.feed.outputs.signed == 'true' }}
        run: |
          curl --fail --location --retry 3 --retry-all-errors --retry-delay 5 --output public-latest.json https://github.com/Xeron23/swarm-hermes-cockpit/releases/download/updates/latest.json
          node -e "const f = require('./public-latest.json'); if (!f.version || !f.platforms?.['windows-x86_64'] || !f.platforms?.['android-aarch64']) throw new Error('Incomplete public update feed')"
      - name: Summarize release mode
        env:
          UPDATE_SIGNED: ${{ steps.feed.outputs.signed }}
        run: |
          if [ "$UPDATE_SIGNED" = "true" ]; then
            echo 'Release published with signed in-app updater metadata.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Bootstrap installers published. Signing is not configured; update feed generation, promotion and anonymous feed verification were skipped. Any existing signed channel is unchanged.' >> "$GITHUB_STEP_SUMMARY"
          fi
