name: Release Desktop & Mobile App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build-windows:
    name: Build Windows Desktop (x86_64)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Frontend Web
        run: npm run web:build

      - name: Build Tauri Windows App
        run: npx tauri build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create or Update GitHub Release and Upload Windows Artifacts
        run: |
          $TAG_NAME = $env:GITHUB_REF -replace 'refs/tags/', ''
          if (-not $TAG_NAME -or $TAG_NAME -eq 'refs/heads/main') {
            $TAG_NAME = 'v0.1.1'
          }
          Write-Host "Target Release Tag: $TAG_NAME"
          try { gh release view $TAG_NAME } catch { gh release create $TAG_NAME --title "Hermes Cockpit $TAG_NAME" --notes "Production release for Windows & Android with full backend integration." }
          Get-ChildItem -Path src-tauri\target\release\bundle\msi\*.msi, src-tauri\target\release\bundle\nsis\*.exe | ForEach-Object {
            Write-Host "Uploading $_"
            gh release upload $TAG_NAME $_.FullName --clobber
          }
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Android NDK & Build-Tools
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;26.1.10909125" "build-tools;34.0.0" "platforms;android-34"
          echo "NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> $GITHUB_ENV

      - name: Install Rust & Android Targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install frontend dependencies
        run: npm ci

      - name: Initialize and Build Android APK
        env:
          NDK_HOME: ${{ env.NDK_HOME }}
        run: |
          npx tauri android init --ci
          npx tauri android build --apk --debug --target aarch64

      - name: Create or Update GitHub Release and Upload APK
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          if [ -z "$TAG_NAME" ] || [ "$TAG_NAME" = "refs/heads/main" ]; then
            TAG_NAME="v0.1.1"
          fi
          echo "Target Release Tag: $TAG_NAME"
          # Create release if it doesn't exist
          gh release view "$TAG_NAME" || gh release create "$TAG_NAME" --title "Hermes Cockpit $TAG_NAME" --notes "Production release with full backend connectivity (FastAPI + PostgreSQL + WebSocket telemetry)."
          # Upload Android APK
          gh release upload "$TAG_NAME" src-tauri/gen/android/app/build/outputs/apk/universal/debug/app-universal-debug.apk --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
