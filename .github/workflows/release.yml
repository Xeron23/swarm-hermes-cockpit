name: Build and release Windows & Android

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

env:
  CARGO_BUILD_JOBS: 2
  CARGO_TERM_COLOR: always

jobs:
  validate:
    name: Validate client and release metadata
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      updater_signing: ${{ steps.signing.outputs.enabled }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Validate persistent APK signing and plan optional updater signing
        id: signing
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          node --input-type=module <<'JS'
          import { appendFileSync } from 'node:fs';
          import { signingInputs, decodeKeystore } from './scripts/android-release.mjs';
          decodeKeystore(signingInputs(process.env).base64);
          const enabled = Boolean(process.env.TAURI_SIGNING_PRIVATE_KEY);
          appendFileSync(process.env.GITHUB_OUTPUT, `enabled=${enabled}\n`);
          console.log(enabled ? 'Release mode: signed updater' : 'Release mode: bootstrap installers (updater signing not configured)');
          JS
      - run: npm ci
      - run: npm run check && npm test && npm run web:build
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify updater signature validation
        run: cargo test --locked --manifest-path scripts/updater-verifier/Cargo.toml
      - name: Verify frontend source identity
        run: node scripts/check-build-info.mjs
      - name: Plan release
        id: release
        run: node scripts/release.mjs metadata

  build-windows:
    name: Windows x86_64 installers
    needs: validate
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: windows-x86_64
      - run: npm ci
      - name: Remove cached installer outputs
        shell: pwsh
        run: |
          if (Test-Path src-tauri/target/release/bundle) {
            Remove-Item src-tauri/target/release/bundle -Recurse -Force
          }
      - name: Build NSIS and MSI
        run: npx tauri build --ci --bundles msi,nsis -- --locked
      - name: Verify frontend source identity after native build
        run: node scripts/check-build-info.mjs
      - name: Verify native HTTP and command permissions on Windows
        run: node scripts/test-windows-native.mjs
        env:
          HTTP_PROXY: http://127.0.0.1:9
          HTTPS_PROXY: http://127.0.0.1:9
          ALL_PROXY: http://127.0.0.1:9
          NO_PROXY: ''
      - name: Collect Windows installers
        shell: pwsh
        run: |
          $files = @(Get-ChildItem src-tauri/target/release/bundle -Recurse -File | Where-Object { $_.Extension -in '.exe', '.msi' })
          foreach ($extension in '.exe', '.msi') {
            if (-not ($files | Where-Object { $_.Extension -eq $extension })) {
              throw "Missing Windows installer: $extension"
            }
          }
          New-Item -ItemType Directory -Path release-assets -Force | Out-Null
          Copy-Item -LiteralPath $files.FullName -Destination release-assets
      - name: Sign and verify Windows updater packages
        run: node scripts/sign-updates.mjs release-assets
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          HERMES_UPDATER_SIGNING_REQUIRED: ${{ needs.validate.outputs.updater_signing }}
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: release-assets/*
          if-no-files-found: error
          retention-days: 14

  build-android:
    name: Android ARM64 optimized release APK
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      ANDROID_NDK_VERSION: 28.2.13676358
      ANDROID_BUILD_TOOLS_VERSION: 37.0.0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
        with:
          # Official repository: commandlinetools-linux-16111833_latest.zip.
          cmdline-tools-version: '16111833'
          log-accepted-android-sdk-licenses: false
          packages: platform-tools
      - name: Install SDK matching the pinned Tauri CLI template
        run: |
          sdkmanager --install "platforms;android-36" "platforms;android-37.0" "build-tools;37.0.0" "ndk;$ANDROID_NDK_VERSION"
          echo "NDK_HOME=$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: android-aarch64-release-ndk28-v1
      - run: npm ci
      - name: Generate Android project
        run: npx tauri android init --ci --skip-targets-install
      - name: Build, align, sign and inspect optimized release APK
        run: npm run android:build
        env:
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
          ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
      - name: Verify frontend source identity after native build
        run: node scripts/check-build-info.mjs
      - name: Preserve APK inspection report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics-android-apk
          path: reports/android-apk-release.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Sign and verify Android updater package
        run: node scripts/sign-updates.mjs release-assets
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          HERMES_UPDATER_SIGNING_REQUIRED: ${{ needs.validate.outputs.updater_signing }}
      - uses: actions/upload-artifact@v4
        with:
          name: release-android
          path: release-assets/*
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish ${{ needs.validate.outputs.tag }}
    needs: [validate, build-windows, build-android]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: hermes-stable-release-publication
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - run: npm ci
      - name: Prepare optional signed manifest for the version release
        id: feed
        run: node scripts/publish-public.mjs prepare release-assets
        env:
          HERMES_UPDATER_SIGNING_REQUIRED: ${{ needs.validate.outputs.updater_signing }}
      - name: Publish complete version release and select stable latest
        id: release
        run: node scripts/release.mjs publish release-assets
        env:
          GH_TOKEN: ${{ github.token }}
          HERMES_UPDATER_SIGNING_REQUIRED: ${{ needs.validate.outputs.updater_signing }}
      - name: Verify anonymous version and latest manifests
        if: ${{ steps.release.outputs.signed == 'true' }}
        run: node scripts/verify-release-feed.mjs
        env:
          HERMES_VERIFY_LATEST: ${{ steps.release.outputs.latest }}
      - name: Summarize release mode
        env:
          UPDATE_SIGNED: ${{ steps.release.outputs.signed }}
          STABLE_LATEST: ${{ steps.release.outputs.latest }}
        run: |
          if [ "$UPDATE_SIGNED" = "true" ]; then
            echo "Signed packages and latest.json are in the version release. Stable latest: $STABLE_LATEST" >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Bootstrap installers published as a prerelease. No signed manifest or stable latest promotion.' >> "$GITHUB_STEP_SUMMARY"
          fi
