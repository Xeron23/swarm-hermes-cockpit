[package]
name = "hermes-cockpit"
version = "0.1.2"
description = "Hermes mission control client"
edition = "2021"
rust-version = "1.90"

[lib]
name = "hermes_cockpit_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-http = "2"
tauri-plugin-websocket = "2"
serde = { version = "1", features = ["derive"] }
